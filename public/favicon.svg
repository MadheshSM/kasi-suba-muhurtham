<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kasi Suba Muhurtham">
  <title>Kasi Suba Muhurtham</title>
  <defs>
    <linearGradient id="ksm-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a82d14"/>
      <stop offset="1" stop-color="#7d1f0c"/>
    </linearGradient>
  </defs>

  <!-- rust ground, matching --rust / --rust-deep from styles.scss -->
  <rect width="64" height="64" rx="14" fill="url(#ksm-ground)"/>

  <!-- temple-gold ring -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="10.5"
        fill="none" stroke="#c9992f" stroke-width="2" opacity=".9"/>

  <!-- serif K monogram -->
  <g transform="translate(-1 0)" fill="none" stroke="#e5c168" stroke-linecap="butt">
    <path d="M24 18V46" stroke-width="7"/>
    <path d="M18.5 19.6H30.5" stroke-width="3.2"/>
    <path d="M18.5 44.4H30.5" stroke-width="3.2"/>
    <path d="M25.5 34 40.8 20" stroke-width="6"/>
    <path d="M37.5 19.6H44.8" stroke-width="3.2"/>
    <path d="M29.6 30.2 44 45.4" stroke-width="6.5"/>
    <path d="M38.6 44.4H47.4" stroke-width="3.4"/>
  </g>
</svg>
